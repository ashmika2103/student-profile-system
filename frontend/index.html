<!DOCTYPE html>
<html lang="en">
<script src="js/navigation.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profiling System - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- REGISTER LINK -->
            <div class="register-top">

                <span>New Student?</span>

                <a
                    href="student-register.html"
                    class="register-button"
                >
                    Register
                </a>

            </div>


            <!-- HEADER -->
            <div class="login-header">

                <h1>
                    Student Profiling System
                </h1>

                <p>
                    Student Academic Personal and Career Profiling System
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- LOGIN ID -->
                <div class="form-group">

                    <label for="loginId">
                        Login ID
                    </label>

                    <input
                        type="text"
                        id="loginId"
                        name="loginId"
                        placeholder="Enter Login ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >

                    <!-- SHOW PASSWORD -->
                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:8px;
                            margin-top:8px;
                            font-size:14px;
                            cursor:pointer;
                        "
                    >

                        <input
                            type="checkbox"
                            id="showLoginPassword"
                            style="
                                width:auto;
                                margin:0;
                                cursor:pointer;
                            "
                        >

                        <span>
                            Show Password
                        </span>

                    </label>

                </div>


                <!-- ROLE -->
                <div class="form-group">

                    <label for="role">
                        Role
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select Role
                        </option>

                        <option value="Student">
                            Student
                        </option>

                        <option value="Faculty">
                            Faculty
                        </option>

                    </select>

                </div>


                <!-- ERROR -->
                <div
                    id="loginError"
                    class="error-message"
                ></div>


                <!-- LOGIN BUTTON -->
                <div class="login-button-container">

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- APP JS -->
    <script src="js/app.js"></script>


    <!-- SHOW LOGIN PASSWORD -->
    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const password =
                    document.getElementById(
                        "password"
                    );

                const checkbox =
                    document.getElementById(
                        "showLoginPassword"
                    );


                if (
                    password &&
                    checkbox
                ) {

                    checkbox.addEventListener(
                        "change",
                        function () {

                            if (
                                checkbox.checked
                            ) {

                                password.type =
                                    "text";

                            } else {

                                password.type =
                                    "password";
                            }

                        }
                    );
                }

            }
        );

    </script>

</body>

</html>
