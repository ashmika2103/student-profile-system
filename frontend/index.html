<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profiling System - Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<div class="login-page">

    <div class="login-card">

        <h1>🎓</h1>

        <h1>Login</h1>

        <p>
            Select your role and enter your credentials
        </p>


        <div id="loginError"></div>


        <form id="loginForm"
              novalidate>


            <div class="form-group">

                <label>
                    Login As
                </label>

                <select id="role"
                        required>

                    <option value="Student">
                        Student
                    </option>

                    <option value="Faculty">
                        Faculty
                    </option>

                </select>

            </div>


            <br>


            <div class="form-group">

                <label id="loginIdLabel">
                    Register Number / Faculty ID
                </label>

                <input
                    type="text"
                    id="loginId"
                    placeholder="Enter login ID"
                    required>

            </div>


            <br>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>


            <div class="button-container">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Login

                </button>

            </div>


        </form>


        <div class="demo-login">

            <h3>Demo Login</h3>

            <p>
                Student:
                <strong>24BCS034</strong>
                /
                <strong>student123</strong>
            </p>

            <p>
                Faculty:
                <strong>FAC001</strong>
                /
                <strong>faculty123</strong>
            </p>

        </div>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
