<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header>

    <h1>Student Profiling System</h1>

    <nav>

        <a href="student-dashboard.html">
            Dashboard
        </a>

        <a href="Student-profile.html">
            My Profile
        </a>

        <a href="#"
           onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="container">

    <div class="page-title">

        <h1>Student Dashboard</h1>

        <p>
            Welcome to your academic profile
        </p>

    </div>


    <div id="studentDashboard">

        <div class="dashboard-grid">

            <div class="stat-card">

                <h3>Name</h3>

                <p
                    id="studentName"
                    style="font-size:20px;">
                    -
                </p>

            </div>


            <div class="stat-card">

                <h3>Register Number</h3>

                <p
                    id="studentRegisterNumber"
                    style="font-size:20px;">
                    -
                </p>

            </div>


            <div class="stat-card">

                <h3>CGPA</h3>

                <p id="studentCgpa">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>Career Goal</h3>

                <p
                    id="studentCareerGoal"
                    style="font-size:20px;">
                    -
                </p>

            </div>

        </div>


        <div class="button-container">

            <a
                href="Student-profile.html"
                class="btn btn-primary">

                My Profile

            </a>

        </div>

    </div>

</div>


<footer>

    Student Profiling System - Student Dashboard

</footer>


<script src="js/app.js"></script>

</body>

</html>
