<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Students - Faculty</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header>

    <h1>Student Profiling System</h1>

    <nav>

        <a href="faculty-dashboard.html">
            Dashboard
        </a>

        <a href="students.html">
            Students
        </a>

        <a href="add-student.html">
            Add / Update
        </a>

        <a href="#"
           onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="container">

    <div class="page-title">

        <h1>Student List</h1>

        <p>
            Faculty can search and view student information.
        </p>

    </div>


    <!-- FILTER SECTION -->

    <div class="card">

        <div class="filter-grid">

            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                placeholder="Search name or register number">


            <!-- DEPARTMENT -->

            <select id="departmentFilter">

                <option value="">
                    All Departments
                </option>

                <option value="CSE">
                    CSE
                </option>

                <option value="ECE">
                    ECE
                </option>

                <option value="EEE">
                    EEE
                </option>

                <option value="IT">
                    IT
                </option>

                <option value="MECH">
                    MECH
                </option>

            </select>


            <!-- SECTION -->

            <select id="sectionFilter">

                <option value="">
                    All Sections
                </option>

                <option value="A">
                    A
                </option>

                <option value="B">
                    B
                </option>

                <option value="C">
                    C
                </option>

            </select>


            <!-- CATEGORY -->

            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

                <option value="General">
                    General
                </option>

                <option value="BC">
                    BC
                </option>

                <option value="MBC">
                    MBC
                </option>

                <option value="SC">
                    SC
                </option>

                <option value="ST">
                    ST
                </option>

            </select>


            <!-- CAREER -->

            <select id="careerFilter">

                <option value="">
                    All Career Goals
                </option>

                <option value="Placement">
                    Placement
                </option>

                <option value="Higher Studies">
                    Higher Studies
                </option>

                <option value="Entrepreneurship">
                    Entrepreneurship
                </option>

            </select>


            <!-- ARREARS -->

            <select id="arrearFilter">

                <option value="">
                    All Arrear Status
                </option>

                <option value="hasArrears">
                    Has Arrears
                </option>

                <option value="noArrears">
                    No Arrears
                </option>

            </select>

        </div>

    </div>


    <!-- STUDENT TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>S.No</th>

                    <th>
                        Register Number
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Department
                    </th>

                    <th>
                        Section
                    </th>

                    <th>
                        CGPA
                    </th>

                    <th>
                        Career Goal
                    </th>

                    <th>
                        Arrears
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="studentTableBody">

                <tr>

                    <td colspan="9"
                        style="text-align:center;">

                        Loading students...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<footer>

    Student Profiling System - Faculty

</footer>


<!-- =====================================================
     LIBRARIES
     ===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<!-- Navigation -->
<script src="js/navigation.js"></script>


<!-- Main Application -->
<script src="js/app.js"></script>


</body>

</html>
