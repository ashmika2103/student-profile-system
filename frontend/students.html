<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand"
            href="faculty-dashboard.html">

            🎓 Faculty Portal

        </a>


        <div class="navbar-nav ms-auto">

            <a
                class="nav-link"
                href="faculty-dashboard.html">

                Dashboard

            </a>


            <a
                class="nav-link active"
                href="students.html">

                Students

            </a>


            <a
                class="nav-link"
                href="add-student.html">

                Add Student

            </a>


            <a
                class="nav-link logout-link"
                href="#">

                Logout

            </a>

        </div>

    </div>

</nav>



<div class="container page-container">


    <div class="page-title">

        <h2>Student Profiles</h2>

        <p>
            Search and filter student records.
        </p>

    </div>



    <!-- SEARCH -->

    <div class="filter-card">

        <div class="row g-3">

            <div class="col-md-4">

                <label class="form-label">
                    Search Student
                </label>

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Name or Register Number">

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Department
                </label>

                <select
                    id="departmentFilter"
                    class="form-select">

                    <option value="">All</option>
                    <option>CSE</option>
                    <option>IT</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>MECH</option>
                    <option>CIVIL</option>

                </select>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Section
                </label>

                <select
                    id="sectionFilter"
                    class="form-select">

                    <option value="">All</option>
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>

                </select>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Category
                </label>

                <select
                    id="categoryFilter"
                    class="form-select">

                    <option value="">All</option>
                    <option>Hosteller</option>
                    <option>Day Scholar</option>

                </select>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Career Goal
                </label>

                <select
                    id="careerFilter"
                    class="form-select">

                    <option value="">All</option>
                    <option>Placement</option>
                    <option>Higher Studies</option>
                    <option>Entrepreneurship</option>

                </select>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    CGPA
                </label>

                <select
                    id="cgpaFilter"
                    class="form-select">

                    <option value="">All</option>
                    <option value="9">9 and above</option>
                    <option value="8">8 and above</option>
                    <option value="7">7 and above</option>
                    <option value="6">6 and above</option>

                </select>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Arrear Status
                </label>

                <select
                    id="arrearFilter"
                    class="form-select">

                    <option value="">All</option>
                    <option value="Yes">Has Arrears</option>
                    <option value="No">No Arrears</option>

                </select>

            </div>


            <div class="col-md-2 d-flex align-items-end">

                <button
                    type="button"
                    id="clearFilters"
                    class="btn btn-secondary w-100">

                    Clear

                </button>

            </div>

        </div>

    </div>



    <!-- TABLE -->

    <div class="table-container mt-4">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>S.No</th>

                        <th>Register No.</th>

                        <th>Name</th>

                        <th>Department</th>

                        <th>Section</th>

                        <th>Category</th>

                        <th>CGPA</th>

                        <th>Arrears</th>

                        <th>Career Goal</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="studentTableBody">

                </tbody>

            </table>

        </div>

    </div>


    <div
        id="noStudents"
        class="alert alert-info text-center d-none">

        No students found.

    </div>


</div>


<footer class="footer">

    <p>
        Faculty Portal - Student Profiles
    </p>

</footer>


<script src="js/app.js"></script>

</body>
</html>
